[package]
name = "garcon-native"
version = "0.3.4"
description = "Garcon native client"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"

[lib]
name = "garcon_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.dev]
debug = 0
incremental = false
