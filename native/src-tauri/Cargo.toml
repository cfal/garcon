[package]
name = "garcon-native"
version = "0.4.1"
description = "Garcon native client"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"

[lib]
name = "garcon_native"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_20"] }

[profile.dev]
debug = 0
incremental = false
