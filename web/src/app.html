<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=auto, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f4f6f9" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Garcon" />
		<!-- Keeps installed-app geometry independent of theme scripts. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="description" content="AI-powered coding assistant" />
		<link
			data-garcon-icon="favicon-ico"
			rel="icon"
			href="/icons/favicon.95ab221cbb84.ico"
			sizes="48x48"
		/>
		<link
			data-garcon-icon="icon-svg"
			rel="icon"
			href="/icons/icon.fb8a0695ab5d.svg"
			type="image/svg+xml"
		/>
		<link
			data-garcon-icon="favicon-16"
			rel="icon"
			href="/icons/favicon-16x16.05285c68a090.png"
			sizes="16x16"
			type="image/png"
		/>
		<link
			data-garcon-icon="favicon-32"
			rel="icon"
			href="/icons/favicon-32x32.6031e2a54cc3.png"
			sizes="32x32"
			type="image/png"
		/>
		<link
			data-garcon-icon="apple-touch"
			rel="apple-touch-icon"
			href="/icons/apple-touch-icon.77c83ea27661.png"
		/>
		<link rel="manifest" href="/site.webmanifest" />
		<title>Garcon</title>
		<script>
			(() => {
				const profiles = {
					'classic-light': { colorScheme: 'light', themeColor: '#ffffff' },
					'classic-dark': { colorScheme: 'dark', themeColor: '#0c1117' },
					'phosphor-light': { colorScheme: 'light', themeColor: '#f4f6f9' },
					'phosphor-dark': { colorScheme: 'dark', themeColor: '#090b11' },
					'colorblind-light': { colorScheme: 'light', themeColor: '#ffffff' },
					'colorblind-dark': { colorScheme: 'dark', themeColor: '#0c1117' },
					'owl-light': { colorScheme: 'light', themeColor: '#fbfbfb' },
					'owl-dark': { colorScheme: 'dark', themeColor: '#011627' },
					'neko-light': { colorScheme: 'light', themeColor: '#eff1f5' },
					'neko-dark': { colorScheme: 'dark', themeColor: '#1e1e2e' },
					'lagoon-light': { colorScheme: 'light', themeColor: '#f3f9f9' },
					'lagoon-dark': { colorScheme: 'dark', themeColor: '#111b1d' },
					'rose-light': { colorScheme: 'light', themeColor: '#faf4f6' },
					'rose-dark': { colorScheme: 'dark', themeColor: '#1e151a' },
					'moss-light': { colorScheme: 'light', themeColor: '#f4f7f2' },
					'moss-dark': { colorScheme: 'dark', themeColor: '#141b13' },
					'paper-light': { colorScheme: 'light', themeColor: '#f7f1e3' },
					'paper-dark': { colorScheme: 'dark', themeColor: '#272420' },
					'slate-light': { colorScheme: 'light', themeColor: '#f6f7f9' },
					'slate-dark': { colorScheme: 'dark', themeColor: '#282c34' },
					'ansi-light': { colorScheme: 'light', themeColor: '#f0f0f0' },
					'ansi-dark': { colorScheme: 'dark', themeColor: '#0d0d0d' },
				};
				const defaultPreference = {
					mode: 'system',
					lightThemeId: 'phosphor-light',
					darkThemeId: 'phosphor-dark',
				};
				const isRecord = (value) =>
					value !== null && typeof value === 'object' && !Array.isArray(value);
				const isThemeId = (value) =>
					typeof value === 'string' && Object.prototype.hasOwnProperty.call(profiles, value);
				let preference = defaultPreference;
				let terminalAppearance = false;
				let typography = {};
				try {
					const stored = JSON.parse(localStorage.getItem('pref_local_settings') ?? '{}');
					terminalAppearance = isRecord(stored) && stored.terminalAppearance === true;
					if (isRecord(stored)) {
						typography = stored;
					}
					const candidate = isRecord(stored) ? stored.themePreference : undefined;
					if (isRecord(candidate) && candidate.mode === 'fixed' && isThemeId(candidate.themeId)) {
						preference = { mode: 'fixed', themeId: candidate.themeId };
					} else if (
						isRecord(candidate) &&
						candidate.mode === 'system' &&
						isThemeId(candidate.lightThemeId) &&
						isThemeId(candidate.darkThemeId) &&
						profiles[candidate.lightThemeId].colorScheme === 'light' &&
						profiles[candidate.darkThemeId].colorScheme === 'dark'
					) {
						preference = {
							mode: 'system',
							lightThemeId: candidate.lightThemeId,
							darkThemeId: candidate.darkThemeId,
						};
					}
				} catch {
					// Falls back when persisted settings are unavailable.
				}

				const systemScheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				let themeId;
				if (preference.mode === 'fixed') {
					themeId = preference.themeId;
				} else if (systemScheme === 'dark') {
					themeId = preference.darkThemeId;
				} else {
					themeId = preference.lightThemeId;
				}
				const profile = profiles[themeId];
				const root = document.documentElement;
				root.dataset.theme = themeId;
				root.dataset.themeAppearance = terminalAppearance ? 'terminal' : 'standard';
				const surfaces = [
					['interface', 'interfaceFont', 'interfaceFontSize', 14],
					['chat-list', 'chatListFont', 'chatListFontSize', 14],
					['chat-feed', 'chatFeedFont', 'chatFeedFontSize', 14],
					['chat-code', 'chatCodeFont', 'chatCodeFontSize', 12],
					['chat-output', 'chatOutputFont', 'chatOutputFontSize', 14],
					['code-editor', 'codeEditorFont', 'codeEditorFontSize', 12],
					['expanded-editor', 'expandedEditorFont', 'expandedEditorFontSize', 14],
					['code-diff', 'codeDiffFont', 'gitDiffFontSize', 12],
					['terminal', 'terminalFont', 'terminalFontSize', 13],
				];
				const fontSizes = ['10', '11', '12', '13', '14', '15', '16', '18', '20'];
				const fonts = [
					'default',
					'system-sans',
					'system-serif',
					'system-mono',
					'departure-mono',
					'jetbrains-mono',
					'inter',
				];
				const monoFonts = ['default', 'system-mono', 'departure-mono', 'jetbrains-mono'];
				// Earlier snapshots persisted these renderer defaults as numeric selections.
				if (!Object.hasOwn(typography, 'interfaceFontSize')) {
					if (typography.codeEditorFontSize === '12') typography.codeEditorFontSize = 'default';
					if (typography.gitDiffFontSize === '12') typography.gitDiffFontSize = 'default';
					if (typography.terminalFontSize === '13') typography.terminalFontSize = 'default';
				}
				for (const [id, fontKey, sizeKey, defaultSize] of surfaces) {
					const parent = {
						'chat-output': ['chatCodeFont', 'chatCodeFontSize'],
						'expanded-editor': ['codeEditorFont', 'codeEditorFontSize'],
					}[id];
					if (parent) {
						if (!Object.hasOwn(typography, fontKey)) typography[fontKey] = typography[parent[0]];
						if (!Object.hasOwn(typography, sizeKey)) typography[sizeKey] = typography[parent[1]];
					}
					const allowedFonts = ['chat-code', 'code-editor', 'code-diff', 'terminal'].includes(id)
						? monoFonts
						: fonts;
					const font = allowedFonts.includes(typography[fontKey]) ? typography[fontKey] : 'default';
					const size = fontSizes.includes(typography[sizeKey]) ? typography[sizeKey] : 'default';
					typography[fontKey] = font;
					typography[sizeKey] = size;
					if (font !== 'default') {
						let family = `var(--font-choice-${font})`;
						if (font === 'departure-mono') {
							if (['chat-list', 'chat-feed', 'chat-output'].includes(id))
								family = '"Departure Mono", var(--system-ui-font)';
							else if (['chat-code', 'code-editor', 'expanded-editor', 'code-diff'].includes(id))
								family = '"Departure Mono", var(--system-code-font)';
						}
						root.style.setProperty(`--${id}-font-override`, family);
					}
					root.setAttribute(`data-${id}-font`, font);
					root.setAttribute(`data-${id}-font-size`, size);
					if (size !== 'default') root.style.setProperty(`--${id}-font-size`, `${size}px`);
					root.style.setProperty(
						`--${id}-font-scale`,
						size === 'default' ? '1' : String(Number(size) / defaultSize),
					);
				}
				root.classList.toggle('dark', profile.colorScheme === 'dark');
				root.style.colorScheme = profile.colorScheme;
				document
					.querySelector('meta[name="theme-color"]')
					?.setAttribute('content', profile.themeColor);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
