<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
		/>
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f4f6f9" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Garcon" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="description" content="AI-powered coding assistant" />
		<link rel="icon" href="/favicon.ico" sizes="48x48" />
		<link rel="icon" href="/icon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
		<link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<title>Garcon</title>
		<script>
			(() => {
				const profiles = {
					'classic-light': { colorScheme: 'light', themeColor: '#ffffff' },
					'classic-dark': { colorScheme: 'dark', themeColor: '#0c1117' },
					'phosphor-light': { colorScheme: 'light', themeColor: '#f4f6f9' },
					'phosphor-dark': { colorScheme: 'dark', themeColor: '#090b11' },
					'colorblind-light': { colorScheme: 'light', themeColor: '#ffffff' },
					'colorblind-dark': { colorScheme: 'dark', themeColor: '#0c1117' },
				};
				const defaultPreference = {
					mode: 'system',
					lightThemeId: 'phosphor-light',
					darkThemeId: 'phosphor-dark',
				};
				const isRecord = (value) =>
					value !== null && typeof value === 'object' && !Array.isArray(value);
				const isThemeId = (value) =>
					typeof value === 'string' && Object.prototype.hasOwnProperty.call(profiles, value);
				let preference = defaultPreference;
				try {
					const stored = JSON.parse(localStorage.getItem('pref_local_settings') ?? '{}');
					const candidate = isRecord(stored) ? stored.themePreference : undefined;
					if (isRecord(candidate) && candidate.mode === 'fixed' && isThemeId(candidate.themeId)) {
						preference = { mode: 'fixed', themeId: candidate.themeId };
					} else if (
						isRecord(candidate) &&
						candidate.mode === 'system' &&
						isThemeId(candidate.lightThemeId) &&
						isThemeId(candidate.darkThemeId) &&
						profiles[candidate.lightThemeId].colorScheme === 'light' &&
						profiles[candidate.darkThemeId].colorScheme === 'dark'
					) {
						preference = {
							mode: 'system',
							lightThemeId: candidate.lightThemeId,
							darkThemeId: candidate.darkThemeId,
						};
					}
				} catch {
					// Falls back when persisted settings are unavailable.
				}

				const systemScheme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				let themeId;
				if (preference.mode === 'fixed') {
					themeId = preference.themeId;
				} else if (systemScheme === 'dark') {
					themeId = preference.darkThemeId;
				} else {
					themeId = preference.lightThemeId;
				}
				const profile = profiles[themeId];
				const root = document.documentElement;
				root.dataset.theme = themeId;
				root.classList.toggle('dark', profile.colorScheme === 'dark');
				root.style.colorScheme = profile.colorScheme;
				document
					.querySelector('meta[name="theme-color"]')
					?.setAttribute('content', profile.themeColor);
				document
					.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
					?.setAttribute(
						'content',
						profile.colorScheme === 'dark' ? 'black-translucent' : 'default',
					);
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
