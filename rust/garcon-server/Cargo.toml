[package]
name = "garcon-server"
version = "0.0.0"
description = "Rust front door for the Garcon controller; serves ported routes natively and proxies the rest to the TypeScript original."
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
bytes = "1"
garcon-contract.workspace = true
garcon-controller.workspace = true
garcon-executor.workspace = true
garcon-http.workspace = true
garcon-interface.workspace = true
http-body-util = "0.1"
libc = "0.2"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
socket2 = "0.6"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }



[dev-dependencies]
async-trait.workspace = true
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
futures.workspace = true
garcon-base.workspace = true
garcon-chats = { path = "../garcon-chats" }
garcon-contract.workspace = true
garcon-execution.workspace = true
garcon-executor.workspace = true
garcon-interface.workspace = true
garcon-ledger.workspace = true
garcon-stores.workspace = true
ruzstd = "0.8"
serde_json.workspace = true
tempfile = "3"
tokio-util.workspace = true
tower-service = "0.3"
