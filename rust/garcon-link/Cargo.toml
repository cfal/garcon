[package]
name = "garcon-link"
version = "0.0.0"
description = "The encrypted executor link; ports @cfal/noise-ws and server/remote/transport."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
base64 = "0.23"
bytes.workspace = true
futures.workspace = true
garcon-base.workspace = true
garcon-contract.workspace = true
garcon-interface.workspace = true
garcon-js.workspace = true
hkdf = "0.12"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap.workspace = true
rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.27", default-features = false, features = ["connect", "handshake", "rustls", "rustls-tls-webpki-roots"] }
tokio-util.workspace = true
url.workspace = true
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize", "getrandom"] }
zeroize = "1"

[dev-dependencies]
garcon-cases.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
