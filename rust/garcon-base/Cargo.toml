[package]
name = "garcon-base"
version = "0.0.0"
description = "Backend primitives shared by the Garcon controller and worker; ports server/common."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23"
bytes.workspace = true
futures.workspace = true
garcon-contract.workspace = true
garcon-interface.workspace = true
garcon-js.workspace = true
getrandom = "0.4"
hmac = "0.12"
http = "1"
http-body = "1"
http-body-util = "0.1"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Storage_FileSystem"] }

[dev-dependencies]
garcon-cases.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
