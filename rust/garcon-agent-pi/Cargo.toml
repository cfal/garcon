[package]
name = "garcon-agent-pi"
version = "0.0.0"
description = "The Pi agent integration."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
futures.workspace = true
garcon-agents-common.workspace = true
garcon-base.workspace = true
garcon-contract.workspace = true
garcon-interface.workspace = true
garcon-js.workspace = true
indexmap.workspace = true
regex = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["process", "signal"] }

[dev-dependencies]
garcon-agents-common = { workspace = true, features = ["test-support"] }
garcon-cases.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
