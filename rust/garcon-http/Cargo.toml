[package]
name = "garcon-http"
version = "0.0.0"
description = "The controller's HTTP and WebSocket surface: listener, routing, and routes."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.23"
bytes.workspace = true
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
futures.workspace = true
garcon-base.workspace = true
garcon-chats = { path = "../garcon-chats" }
garcon-contract.workspace = true
garcon-execution.workspace = true
garcon-interface.workspace = true
garcon-js.workspace = true
garcon-ledger.workspace = true
garcon-stores.workspace = true
hashlink = "0.10"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
indexmap.workspace = true
regex = "1"
ruzstd = "0.8"
serde.workspace = true
serde_json.workspace = true
sha1 = "0.10"
subtle = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-util = { workspace = true, features = ["rt"] }
url.workspace = true
uuid = { version = "1", features = ["v4"] }
yawc = { version = "0.5.0", default-features = false, features = ["zlib"] }

[dev-dependencies]
garcon-cases.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
