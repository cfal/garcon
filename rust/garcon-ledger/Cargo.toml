[package]
name = "garcon-ledger"
version = "0.0.0"
description = "Controller-owned per-chat transcript ledger."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
garcon-base.workspace = true
garcon-contract.workspace = true
garcon-interface.workspace = true
garcon-js.workspace = true
indexmap.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
garcon-cases.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
