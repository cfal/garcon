[workspace]
resolver = "3"
members = ["garcon-base", "garcon-bench", "garcon-cases", "garcon-contract", "garcon-controller", "garcon-execution", "garcon-executor", "garcon-http", "garcon-interface", "garcon-js", "garcon-ledger", "garcon-link", "garcon-runtime", "garcon-search", "garcon-server", "garcon-stores"]

[workspace.package]
edition = "2024"
license = "GPL-3.0"
publish = false

[workspace.dependencies]
garcon-base = { path = "garcon-base" }
garcon-cases = { path = "garcon-cases" }
garcon-contract = { path = "garcon-contract" }
garcon-controller = { path = "garcon-controller" }
garcon-execution = { path = "garcon-execution" }
garcon-executor = { path = "garcon-executor" }
garcon-http = { path = "garcon-http" }
garcon-interface = { path = "garcon-interface" }
garcon-js = { path = "garcon-js" }
garcon-ledger = { path = "garcon-ledger" }
garcon-link = { path = "garcon-link" }
garcon-stores = { path = "garcon-stores" }
async-trait = "0.1"
bytes = "1"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
ryu-js = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order", "raw_value"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tokio-util = "0.7"
url = "2"

[workspace.lints.clippy]
await_holding_refcell_ref = "deny"
