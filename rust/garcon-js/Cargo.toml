[package]
name = "garcon-js"
version = "0.0.0"
description = "JavaScript semantics the ported code relies on: number formatting, UTF-16 string measures, Node path functions, and the clock."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Pins ICU 78-era collation data to match the generation in Bun 1.4.3.
icu_collator = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
ryu-js.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tz-rs = { version = "0.7.3", default-features = false }
tzdb = { version = "0.7.3", default-features = false, features = ["local"] }

[dev-dependencies]
tempfile.workspace = true
