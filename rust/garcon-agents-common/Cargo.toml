[package]
name = "garcon-agents-common"
version = "0.0.0"
description = "Shared runtime services and execution adapters for Garcon agent integrations."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
async-trait.workspace = true
base64 = "0.23"
futures.workspace = true
garcon-base.workspace = true
garcon-contract.workspace = true
garcon-interface.workspace = true
garcon-js.workspace = true
indexmap.workspace = true
ipnet = "2"
murmur3 = "0.5"
regress = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "json", "stream", "gzip", "brotli", "deflate", "zstd"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
twox-hash = { version = "2", default-features = false, features = ["xxhash32"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
garcon-cases.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
