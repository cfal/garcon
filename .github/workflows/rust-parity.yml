name: Rust Parity

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt,clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --release --all-targets -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path rust/Cargo.toml --release

      - name: Build the front door
        run: bun run rust:build

      # The original must replay its own recordings, so a TypeScript change to
      # recorded behavior fails here until the recordings are made again.
      - name: Replay recordings against the original
        run: bun run parity:replay

      - name: Replay recordings against the front door
        run: bun run parity:replay:rust

      # The committed report pins which cases the front door serves without
      # the original, so coverage changes in either direction are reviewed.
      - name: Check the committed replay report
        run: git diff --exit-code rust/parity/replay-report.md
