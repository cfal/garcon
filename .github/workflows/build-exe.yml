name: Build Executable

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Validate release versions
        id: version
        run: |
          set -euo pipefail
          args=()
          if [ "$GITHUB_REF_TYPE" = tag ]; then args+=("$GITHUB_REF_NAME"); fi
          version="$(bun scripts/release-version.js "${args[@]}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build-exe:
    needs: version
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.version.outputs.version }}
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Prepare Bun compile targets
        run: |
          set -euo pipefail
          target_root="${RUNNER_TEMP}/garcon-bun-compile-targets"
          mkdir -p "${target_root}/linux" "${target_root}/windows"
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-linux-x64-baseline.zip \
            --output "${target_root}/linux.zip"
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.3/bun-windows-x64-baseline.zip \
            --output "${target_root}/windows.zip"
          unzip -q "${target_root}/linux.zip" -d "${target_root}/linux"
          unzip -q "${target_root}/windows.zip" -d "${target_root}/windows"

          linux_executable="${target_root}/linux/bun-linux-x64-baseline/bun"
          windows_executable="${target_root}/windows/bun-windows-x64-baseline/bun.exe"
          test -f "${windows_executable}"
          if [ "$("${linux_executable}" --revision)" != "$(bun --revision)" ]; then
            echo "Bun compile target does not match the installed Bun revision."
            exit 1
          fi

          echo "GARCON_BUN_COMPILE_LINUX_X64_EXECUTABLE=${linux_executable}" >> "$GITHUB_ENV"
          echo "GARCON_BUN_COMPILE_WINDOWS_X64_EXECUTABLE=${windows_executable}" >> "$GITHUB_ENV"

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install integration-test dependencies
        working-directory: integration-tests
        run: bun install --frozen-lockfile

      - name: Compile Paraglide messages
        working-directory: web
        run: bun run i18n:compile

      - name: Run checks
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: bun run check

      - name: Install Shell test dependencies
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zsh fish
          zsh --version
          fish --version

      - name: Run server tests for release validation
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: bun run test:server

      - name: Run CLI checks
        run: bun run --cwd cli typecheck && bun run --cwd cli test

      - name: Run web tests for release validation
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: bun run --cwd web test

      - name: Build web app
        run: bun run build

      - name: Compile executables
        run: bun run build-exe:compile --target=linux-x64,windows-x64

      - name: Smoke test Linux x64 executable
        run: bun run build-exe:smoke:linux-x64

      - name: Verify executables exist
        run: |
          # Leaves Darwin arm64 disabled until the produced binary stops failing Gatekeeper with "damaged and can't be opened".
          for executable in \
            dist/garcon-linux-x64 \
            dist/garcon-windows-x64.exe \
            dist/garcon-cli-linux-x64; do
            if [ ! -f "$executable" ]; then
              echo "Expected executable at $executable"
              ls -la dist || true
              exit 1
            fi

            ls -la "$executable"
            file "$executable" || true
          done

      - name: Prepare executable artifacts
        run: |
          mkdir -p artifacts
          cp dist/garcon-linux-x64 "artifacts/garcon-v${PACKAGE_VERSION}-linux-x64"
          cp dist/garcon-windows-x64.exe "artifacts/garcon-v${PACKAGE_VERSION}-windows-x64.exe"
          cp dist/garcon-cli-linux-x64 "artifacts/garcon-cli-v${PACKAGE_VERSION}-linux-x64"

          ls -la artifacts

      - name: Upload Linux x64 executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: garcon-v${{ env.PACKAGE_VERSION }}-linux-x64
          path: artifacts/garcon-v${{ env.PACKAGE_VERSION }}-linux-x64
          if-no-files-found: error

      - name: Upload Windows x64 executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: garcon-v${{ env.PACKAGE_VERSION }}-windows-x64.exe
          path: artifacts/garcon-v${{ env.PACKAGE_VERSION }}-windows-x64.exe
          if-no-files-found: error

      - name: Upload Linux x64 CLI executable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: garcon-cli-v${{ env.PACKAGE_VERSION }}-linux-x64
          path: artifacts/garcon-cli-v${{ env.PACKAGE_VERSION }}-linux-x64
          if-no-files-found: error

  native:
    needs: version
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/native-app.yml

  assemble:
    name: Assemble Release Candidate
    needs: [version, build-exe, native]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Download same-run payloads
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: garcon-*
          path: artifacts
          merge-multiple: false
      - name: Verify and package release assets
        run: bun scripts/release-assets.js artifacts release
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate
          path: release/*
          if-no-files-found: error

  release:
    name: Create Draft Release
    needs: assemble
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-candidate
          path: release
      - name: Verify final inventory and checksums
        run: bun scripts/release-assets.js verify release
      - name: Guard provenance source and release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-github.js draft-guard
      - name: Attest final release bytes
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/*
      - name: Refuse moved tags and existing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-github.js draft-guard
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --generate-notes --notes-file docs/release-notes.md
