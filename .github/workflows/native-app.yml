name: Native App

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'native/**'
      - 'web/static/icons/**'
      - 'common/ws-auth.ts'
      - 'bunfig.toml'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/native-app.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'web/static/icons/**'
      - 'common/ws-auth.ts'
      - 'bunfig.toml'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/native-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb xauth webkit2gtk-driver
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build launcher and icons
        run: bun run build
      - name: Test launcher and scaffold
        run: bun run test
      - name: Check host formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test native host
        run: bun run test:host
      - name: Build native packages
        run: bun run tauri build --ci --no-sign --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' -- --locked
      - name: Install Linux smoke driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Build Linux smoke executable
        if: runner.os == 'Linux'
        run: bun run tauri build --debug --no-bundle -- --locked
      - name: Smoke test native WebView
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:smoke
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: garcon-native-${{ matrix.target }}
          path: |
            native/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            native/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            native/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            native/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload native smoke diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-smoke
          path: native/artifacts/
          if-no-files-found: ignore

  android:
    name: Android build-only debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK and NDK
        run: |
          sdkmanager 'platform-tools' 'platforms;android-37.0' 'ndk;29.0.13846066'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build launcher and icons
        run: bun run build
      - name: Generate Android project
        run: bun run tauri android init --ci --skip-targets-install
      - name: Build Android APK
        run: bun run tauri android build --ci --debug --apk --target aarch64 --target x86_64
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: garcon-native-android-build-only-debug
          path: native/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned simulator app
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install Xcode project generator
        run: brew install xcodegen libimobiledevice
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build launcher and icons
        run: bun run build
      - name: Generate iOS project
        run: bun run tauri ios init --ci --skip-targets-install
      - name: Build unsigned simulator app
        run: |
          case "$(uname -m)" in
            arm64) target=aarch64-sim ;;
            x86_64) target=x86_64 ;;
            *) exit 1 ;;
          esac
          bun run tauri ios build --ci --debug --target "$target" --no-sign
      - name: Archive simulator app
        run: bun scripts/archive-ios.js
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: garcon-native-ios-simulator
          path: native/artifacts/Garcon-simulator.app.zip
          if-no-files-found: error
