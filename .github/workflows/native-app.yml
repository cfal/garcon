name: Native App

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'web/static/icons/**'
      - 'web/src/lib/utils/clipboard.ts'
      - 'common/ws-auth.ts'
      - 'bunfig.toml'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/native-app.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'web/static/icons/**'
      - 'web/src/lib/utils/clipboard.ts'
      - 'common/ws-auth.ts'
      - 'bunfig.toml'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/native-app.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: native-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 1
  CARGO_INCREMENTAL: 0

jobs:
  desktop:
    name: Desktop (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - runner: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
          components: rustfmt,clippy
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libxdo-dev librsvg2-dev libayatana-appindicator3-dev patchelf xvfb xauth openbox webkit2gtk-driver xdotool openssl curl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build launcher and icons
        run: bun run build
      - name: Test launcher and scaffold
        run: bun run test
      - name: Check host formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Test native host
        run: bun run test:host
      - name: Build native packages
        run: bun run tauri build --ci --no-sign --target '${{ matrix.target }}' --bundles '${{ matrix.bundles }}' -- --locked
      - name: Install Linux smoke driver
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Build Linux smoke executable
        if: runner.os == 'Linux'
        run: bun run tauri build --debug --no-bundle -- --locked
      - name: Smoke test native WebView
        if: runner.os == 'Linux'
        run: xvfb-run -a bun scripts/smoke-x11.js
      - name: Validate preview packages
        run: bun run distribution preview '${{ matrix.target }}'
      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: garcon-native-${{ matrix.target }}
          path: |
            native/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            native/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            native/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            native/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            native/artifacts/distribution-${{ matrix.target }}.json
          if-no-files-found: error
      - name: Upload native smoke diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: native-linux-smoke
          path: native/artifacts/
          if-no-files-found: ignore

  android:
    name: Android build-only APK and safety regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    env:
      GRADLE_OPTS: -Dorg.gradle.workers.max=1 -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android SDK and NDK
        run: |
          sdkmanager 'platform-tools' 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.13846066'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.13846066" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build launcher and icons
        run: bun run build
      - name: Generate Android project
        run: bun run tauri android init --ci --skip-targets-install
      - name: Build Android APK
        run: bun run tauri android build --ci --debug --apk --target aarch64 --target x86_64
      - name: Prepare tracked Android safety tests
        run: bun run test:android:prepare
      - name: Compile Android safety tests against the built host
        run: src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:assembleUniversalDebugAndroidTest -x :app:rustBuildUniversalDebug --no-daemon --max-workers=1
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-garcon-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android fail-closed and callback-gap regressions
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: native
          script: src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:connectedUniversalDebugAndroidTest -x :app:rustBuildUniversalDebug --no-daemon --max-workers=1
      - name: Validate build-only APK
        run: bun run distribution preview android
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: garcon-native-android-build-only-debug
          path: |
            native/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
            native/artifacts/distribution-android.json
          if-no-files-found: error
      - name: Upload Android safety diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-android-safety
          path: |
            native/src-tauri/gen/android/app/build/reports/androidTests/
            native/src-tauri/gen/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  ios:
    name: iOS unsigned simulator app
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-ios-sim,x86_64-apple-ios
      - name: Install Xcode project generator
        run: brew install xcodegen libimobiledevice
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build launcher and icons
        run: bun run build
      - name: Generate iOS project
        run: bun run tauri ios init --ci --skip-targets-install
      - name: Build unsigned simulator app
        run: |
          case "$(uname -m)" in
            arm64) target=aarch64-sim ;;
            x86_64) target=x86_64 ;;
            *) exit 1 ;;
          esac
          bun run tauri ios build --ci --debug --target "$target" --no-sign
      - name: Archive simulator app
        run: bun scripts/archive-ios.js
      - name: Launch and relaunch in an isolated simulator
        run: bun run test:ios-launch
      - name: Validate simulator archive
        run: bun run distribution preview ios-simulator
      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: garcon-native-ios-simulator
          path: |
            native/artifacts/Garcon-simulator.app.zip
            native/artifacts/distribution-ios-simulator.json
          if-no-files-found: error
      - name: Upload simulator launch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-launch
          path: |
            native/artifacts/ios-*.png
            native/artifacts/ios-launch.log
          if-no-files-found: ignore
