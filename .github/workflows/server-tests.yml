name: Server Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Type-check server and provider agents
        run: bun run typecheck:server

      - name: Run server tests
        run: bun run test:server

      # Runners have procfs; this repeats the file-service tests as a system
      # without descriptor paths, where directory creation is unsupported.
      - name: Run file-service tests without descriptor paths
        run: bun run test:server:no-descriptor-paths

  transcript-search-scale-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install integration-test dependencies
        working-directory: integration-tests
        run: bun install --frozen-lockfile

      - name: Compile Paraglide messages
        working-directory: web
        run: bun run i18n:compile

      - name: Run transcript search scale gate
        run: bun run test:search-gate
