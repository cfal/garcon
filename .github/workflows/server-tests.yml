name: Server Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Prove transcript search v8 bounds
        run: |
          bun run test:transcript-search-v8-proof -- --matrix
          bun run test:transcript-search-v8-proof -- --rss
          bun run test:transcript-search-v8-proof -- --full-h

      - name: Run server tests
        shell: bash
        run: |
          while IFS= read -r test_file; do
            bun test "$test_file"
          done < <(find server -path '*/__tests__/*.test.js' | sort)
