name: Web Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      # Node backs Vitest's thread pools and node-shebang tooling.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Compile Paraglide messages
        working-directory: web
        run: bun run i18n:compile

      # Svelte checks and ESLint run under Bun; Vitest stays on Node.
      - name: Run web checks
        working-directory: web
        run: bun run --bun check

      - name: Run web lint
        working-directory: web
        run: bun run --bun lint

      - name: Run web tests
        working-directory: web
        run: bun run test
