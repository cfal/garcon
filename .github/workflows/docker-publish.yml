name: Publish Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish_sha:
    name: Publish Commit Image
    runs-on: ubuntu-24.04
    concurrency:
      group: docker-publish-sha-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.published.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long,prefix=sha-

      - name: Find existing commit image
        id: existing
        run: |
          set -euo pipefail
          commit_image="${IMAGE}:sha-${GITHUB_SHA}"
          manifest_path="${RUNNER_TEMP}/existing-manifest.json"
          error_path="${RUNNER_TEMP}/existing-manifest-error.log"

          if ! docker buildx imagetools inspect --raw "${commit_image}" > "${manifest_path}" 2> "${error_path}"; then
            if grep -Eiq 'manifest unknown|not found' "${error_path}"; then
              echo "exists=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            cat "${error_path}" >&2
            exit 1
          fi

          if ! jq -e '
            [.manifests[]?.platform | select(.os == "linux") | .architecture] as $architectures
            | ($architectures | index("amd64")) != null
              and ($architectures | index("arm64")) != null
          ' "${manifest_path}" > /dev/null; then
            echo "Existing ${commit_image} is not the expected amd64/arm64 image index." >&2
            exit 1
          fi

          digest="sha256:$(sha256sum "${manifest_path}" | cut -d ' ' -f 1)"
          echo "exists=true" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          echo "Reusing ${commit_image} at ${digest}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Build and push image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,ignore-error=true

      - name: Resolve published digest
        id: published
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${EXISTING_DIGEST:-$BUILT_DIGEST}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Docker publication did not produce a valid digest." >&2
            exit 1
          fi
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

  promote_main:
    name: Advance Main Tag
    needs: publish_sha
    runs-on: ubuntu-24.04
    concurrency:
      group: docker-publish-main-tag
      cancel-in-progress: false
      queue: max

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance main tag
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish_sha.outputs.digest }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          if [ "${head_sha}" != "${GITHUB_SHA}" ]; then
            echo "Built ${GITHUB_SHA}, but main is now ${head_sha}; leaving :main unchanged." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          docker buildx imagetools create \
            --tag "${IMAGE}:main" \
            "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:main"
          echo "Published ${IMAGE}:main and ${IMAGE}:sha-${GITHUB_SHA}." >> "${GITHUB_STEP_SUMMARY}"
