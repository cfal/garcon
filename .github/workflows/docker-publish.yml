name: Publish Docker Image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker/**
      - docker-compose*.yml
      - cli/**
      - common/**
      - server/**
      - server-agents/**
      - package.json
      - bun.lock
      - bunfig.toml
      - patches/**
      - scripts/smoke-docker.js
      - scripts/*release*.js
      - scripts/__tests__/*release*.test.js
      - .github/workflows/docker-publish.yml
  push:
    branches:
      - main
  release:
    types: [published]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  source:
    name: Resolve Publication Source
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      image: ${{ steps.source.outputs.image }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Bind source to the release manifest
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/release-github.js source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
      - name: Validate source version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          args=()
          if [ "$GITHUB_EVENT_NAME" = release ]; then args+=("$RELEASE_TAG"); fi
          version="$(bun scripts/release-version.js "${args[@]}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  verify_pr:
    name: Docker Controller And Executor Smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    concurrency:
      group: docker-verify-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: garcon-pr:smoke
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache

      - name: Verify packaged controller and executors
        run: bun run docker:smoke garcon-pr:smoke

  publish_sha:
    name: Publish Commit Image
    needs: source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ needs.source.outputs.image }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    concurrency:
      group: docker-publish-sha-${{ needs.source.outputs.sha }}
      cancel-in-progress: false
    outputs:
      digest: ${{ steps.published.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: type=raw,value=sha-${{ needs.source.outputs.sha }}
          labels: org.opencontainers.image.revision=${{ needs.source.outputs.sha }}

      - name: Find existing commit image
        id: existing
        run: bun scripts/docker-release.js find

      - name: Build and push image
        id: build
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,ignore-error=true

      - name: Resolve published digest
        id: published
        env:
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: bun scripts/docker-release.js resolve

  smoke:
    name: Verify Controller And Executor Image
    needs: [source, publish_sha]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE: ${{ needs.source.outputs.image }}
    permissions:
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and verify published image
        env:
          DIGEST: ${{ needs.publish_sha.outputs.digest }}
          ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_VERSION: ${{ needs.source.outputs.version }}
        run: |
          set -euo pipefail
          docker pull --platform "linux/${ARCHITECTURE}" "${IMAGE}@${DIGEST}"
          test "$(docker image inspect "${IMAGE}@${DIGEST}" --format '{{.Architecture}}')" = "$ARCHITECTURE"
          bun run docker:smoke "${IMAGE}@${DIGEST}"

  promote_main:
    name: Advance Main Tag
    if: github.event_name == 'push'
    needs: [source, publish_sha, smoke]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    env:
      IMAGE: ${{ needs.source.outputs.image }}
      SOURCE_SHA: ${{ needs.source.outputs.sha }}
    concurrency:
      group: docker-publish-main-tag
      cancel-in-progress: false
      queue: max

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance main tag
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ needs.publish_sha.outputs.digest }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq .commit.sha)"
          if [ "${head_sha}" != "${SOURCE_SHA}" ]; then
            echo "Built ${SOURCE_SHA}, but main is now ${head_sha}; leaving :main unchanged." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          docker buildx imagetools create \
            --tag "${IMAGE}:main" \
            "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}:main"
          echo "Published ${IMAGE}:main and ${IMAGE}:sha-${SOURCE_SHA}." >> "${GITHUB_STEP_SUMMARY}"

  promote_release:
    name: Advance Release Tags
    if: github.event_name == 'release'
    needs: [source, publish_sha, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: docker-publish-release-tags
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified release digest
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.source.outputs.image }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          DIGEST: ${{ needs.publish_sha.outputs.digest }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: bun scripts/docker-release.js promote
